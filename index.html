<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Cam – Lights On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Lights On: the stage (camera + monster) is the whole point; controls sit below it. Dark by design. */
  :root {
    --night: #0d0f14;
    --panel: #171a22;
    --line: #2a2f3c;
    --text: #e8e6e1;
    --muted: #8d93a3;
    --blood: #e0393e;
    --moss: #5fbf7a;
    --lamp: #f2c14e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--text); font: 15px/1.45 'Rubik', system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  button.primary { background: var(--blood); border-color: var(--blood); color: #fff; font-weight: 700; }
  a { color: var(--lamp); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-family: 'Creepster', cursive; font-weight: 400; font-size: 40px; margin: 0; color: var(--lamp); letter-spacing: 1px; }
  header p { margin: 0; color: var(--muted); }

  .stage { position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 12px; overflow: hidden; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
  .pill { background: rgba(0, 0, 0, 0.6); border-radius: 999px; padding: 2px 12px; font-size: 14px; }
  .lives { font-size: 24px; }
  .timer { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--blood); }
  .helpers { position: absolute; left: 12px; top: 54px; display: grid; gap: 6px; justify-items: start; pointer-events: none; }
  .helpers .pill { font-size: 13px; }
  #shieldPill { background: rgba(90, 170, 255, 0.85); color: #04121f; font-weight: 700; }
  .banner.help { background: rgba(60, 140, 230, 0.92); }
  .banner { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: rgba(224, 57, 62, 0.92); color: #fff; font-weight: 700; border-radius: 10px; padding: 6px 16px; font-size: 18px; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; display: none; pointer-events: none; }
  .banner.on { display: block; animation: pop 0.25s ease-out; }
  @keyframes pop { from { transform: translate(-50%, -8px) scale(0.9); opacity: 0; } }
  .notice .catches { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 4px; }
  .lit { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(242, 193, 78, 0.92); color: #1b1400; font-weight: 700; border-radius: 999px; padding: 4px 16px; font-size: 18px; display: none; pointer-events: none; }
  .lit.on { display: block; }
  .curses { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 6px; width: min(240px, 60%); pointer-events: none; }
  .curse { background: rgba(0, 0, 0, 0.65); border-radius: 8px; padding: 4px 8px; font-size: 14px; }
  .curse .bar { height: 6px; background: #333; border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .curse .bar i { display: block; height: 100%; background: var(--blood); }
  .feed { position: absolute; left: 12px; bottom: 12px; display: grid; gap: 4px; max-width: 45%; pointer-events: none; }
  .feed div { background: rgba(0, 0, 0, 0.6); border-radius: 8px; padding: 2px 8px; font-size: 14px; animation: fade 4s forwards; }
  @keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .notice { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.8); border-radius: 14px; padding: 16px 24px; text-align: center; font-size: 20px; font-weight: 700; display: none; max-width: 85%; }
  .notice.on { display: block; }
  .notice big { display: block; font-family: 'Creepster', cursive; font-weight: 400; font-size: 64px; line-height: 1.05; color: var(--lamp); }
  .notice.win big { color: var(--moss); }
  .notice.lose big { color: var(--blood); }
  .notice .dare { display: block; margin: 10px 0 12px; font-size: 18px; font-weight: 500; }
  .notice { width: max-content; }
  @media (max-width: 600px) {
    .notice { font-size: 15px; padding: 10px 14px; }
    .notice big { font-size: 40px; }
    .notice .dare { font-size: 15px; }
    .lit { font-size: 14px; bottom: 8px; }
    .lives { font-size: 18px; }
  }

  .controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 760px) { .controls { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 15px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 8px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  input[type=text] { background: var(--night); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; width: 120px; }
  .log { height: 120px; overflow: auto; font-size: 13px; color: var(--muted); background: var(--night); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  #fakeSliders label { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .feed div { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lights On</h1>
    <p>When the light finds you, freeze. <a href="bench.html">Settings and test bench</a></p>
  </header>

  <div class="stage">
    <canvas id="cv" width="960" height="720" aria-label="Game view"></canvas>
    <div class="hud">
      <span class="pill lives" id="lives"></span>
      <span class="pill timer" id="timer" hidden></span>
      <span class="pill" id="status">Camera off</span>
    </div>
    <div class="helpers">
      <span class="pill" id="shieldPill" hidden></span>
      <span class="pill" id="likeBar" title="Likes chain the monster when the bar is full"></span>
    </div>
    <div class="feed" id="feed"></div>
    <div class="curses" id="curses"></div>
    <div class="banner" id="banner" aria-live="polite"></div>
    <div class="lit" id="lit">🔦 The light is on you. Freeze!</div>
    <div class="notice on" id="notice">Start the camera, calibrate, then start a round.<br><small style="font-weight:400;color:var(--muted)">Everything runs on this computer; no video is sent anywhere.</small></div>
  </div>

  <div class="controls">
    <section>
      <h2>Game</h2>
      <div class="row">
        <button class="primary" id="startBtn">Start camera</button>
        <button id="fakeBtn">No camera: use sliders</button>
        <button id="calBtn" disabled>Calibrate</button>
        <button id="roundBtn" disabled>▶ Start round</button>
      </div>
      <div class="row">
        <span class="hint" style="margin:0">While lit, don't:</span>
        <label class="check"><input type="checkbox" id="r-move"> move</label>
        <label class="check"><input type="checkbox" id="r-smile"> smile</label>
        <label class="check"><input type="checkbox" id="r-blink"> blink</label>
        <label class="check"><input type="checkbox" id="r-sound"> make a sound</label>
        <label class="check">🔊 <input type="range" id="vol" min="0" max="1" step="0.05" aria-label="Volume" style="width:90px"></label>
        <label class="check">🌑 <input type="range" id="dark" min="0.5" max="0.97" step="0.01" aria-label="Darkness" style="width:90px"></label>
      </div>
      <div id="fakeSliders"></div>
    </section>
    <section>
      <h2>Simulator</h2>
      <div class="row">
        <input type="text" id="viewer" value="Ion" aria-label="Viewer name">
        <button data-sim="like">❤️ 25 likes</button>
        <button data-sim="follow">➕ Follow</button>
      </div>
      <div class="row" id="giftBtns"></div>
      <div class="log" id="log" aria-live="polite"></div>
    </section>
  </div>
</div>

<script src="src/settings.js?v=1793961994"></script>
<script src="src/events.js?v=1793961994"></script>
<script src="src/face.js?v=1793961994"></script>
<script src="src/curses.js?v=1793961994"></script>
<script src="src/sfx.js?v=1793961994"></script>
<script src="src/mic.js?v=1793961994"></script>
<script src="src/lightson.js?v=1793961994"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const S = MC.settings.load();
  const save = () => MC.settings.save(S);
  const face = new MC.Face();
  // Hidden video element feeding the canvas. Kept in the page: some browsers stop decoding detached videos.
  const video = document.createElement('video');
  video.playsInline = true; video.muted = true;
  video.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(video);
  let lives = S.lives, calibrating = false;
  const round = { running: false, ends: 0 };
  const giftCount = {};

  function log(html) { $('log').insertAdjacentHTML('afterbegin', `<div>${new Date().toLocaleTimeString()} · ${html}</div>`); }
  function feed(html) {
    $('feed').insertAdjacentHTML('beforeend', `<div>${html}</div>`);
    while ($('feed').children.length > 4) $('feed').firstChild.remove();
  }
  function notice(html, cls = '') { $('notice').className = 'notice on ' + cls; $('notice').innerHTML = html; }
  const hideNotice = () => { $('notice').className = 'notice'; };
  const renderLives = () => { $('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(Math.max(0, S.lives - lives)); };

  // ---------- Game ----------
  // Who caught the streamer this round, in order. `by` is a viewer name, or null for the monster's own patrol.
  let catches = [];
  // Viewers who helped: chained the monster or cleared curses.
  let savers = [];
  let likes = 0;
  function chain(user, now) {
    game.shieldUntil = Math.max(now, game.shieldUntil) + S.shieldSeconds * 1000;
    curses.immuneUntil = Math.max(curses.immuneUntil, game.shieldUntil); // curses can't catch either
    if (!savers.includes(user)) savers.push(user);
    banner(`🛡️ ${esc(user)} chained the monster!`, true);
    log(`🛡️ ${esc(user)} chained the monster for ${S.shieldSeconds} s.`);
  }
  function banner(html, help) {
    $('banner').innerHTML = html;
    $('banner').classList.toggle('help', !!help);
    $('banner').classList.remove('on'); void $('banner').offsetWidth; $('banner').classList.add('on');
    clearTimeout(banner.t);
    banner.t = setTimeout(() => $('banner').classList.remove('on'), 2600);
  }
  const game = new MC.LightsOn($('cv'), S, {
    onCaught: (why, by) => caught(`${why} in the light`, by),
    onPhase: (p) => {
      if (p === 'warn') feed('👣 Footsteps…');
      if (p === 'stare') feed('👁️ It is looking at you');
    },
  });
  const curses = new MC.Curses(S, {
    onCaught: (c) => caught(`broke “${S.curses[c.type].label}”`, c.by),
    onChange() {},
  });

  function caught(why, by = null) {
    if (!round.running || game.phase === 'eaten') return;
    const now = performance.now();
    lives = Math.max(0, lives - 1);
    renderLives();
    game.eat(now, face.state);
    curses.clear();
    catches.push({ by, why });
    banner(by ? `🩸 ${esc(by)} got the streamer!` : '🩸 The hunter got the streamer!');
    log(`🩸 Caught: ${why}${by ? ` (thanks to ${esc(by)})` : ''}. Lives left: ${lives}`);
    if (!lives) setTimeout(() => endRound(false), 1600);
  }

  // ---------- Round ----------
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  function startRound() {
    MC.sfx.unlock();
    lives = S.lives; renderLives();
    catches = [];
    savers = [];
    likes = 0;
    game.shieldUntil = 0;
    renderLikes();
    curses.clear();
    round.running = true;
    round.ends = performance.now() + S.roundSeconds * 1000;
    game.start(performance.now());
    $('timer').hidden = false;
    $('roundBtn').textContent = '■ Stop round';
    hideNotice();
    log(`▶ Round started: survive ${S.roundSeconds} s.`);
  }
  function endRound(won) {
    if (!round.running) return;
    round.running = false;
    game.stop(performance.now());
    curses.clear();
    $('timer').hidden = true;
    $('roundBtn').textContent = '▶ Start round';
    const list = (won ? S.winDares : S.loseDares).filter(Boolean);
    const dare = list.length ? pick(list) : '';
    // Lost: the viewer behind the final catch "ate" the streamer; list everyone who caught them.
    const last = catches[catches.length - 1];
    const eater = last && last.by ? `${esc(last.by)} ate the streamer!` : 'The hunter ate the streamer!';
    const who = catches.map((c) => (c.by ? esc(c.by) : 'the hunter')).join(', ');
    const saved = savers.length ? `<span class="catches">🛡️ Saved by: ${savers.map(esc).join(', ')}</span>` : '';
    notice(won
      ? `<big>You survived!</big>${saved}${dare ? `<span class="dare">${esc(dare)}</span>` : ''}<button class="primary" id="againBtn">Play again</button>`
      : `<big>Eaten!</big><span class="dare">🏆 ${eater}</span><span class="catches">Caught by: ${who}</span>${saved}${dare ? `<span class="dare">Dare: ${esc(dare)}</span>` : ''}<button class="primary" id="againBtn">Play again</button>`, won ? 'win' : 'lose');
    $('againBtn').onclick = startRound;
    log(won ? `🏆 Survived. ${esc(dare)}` : `💀 Eaten. Dare: ${esc(dare)}`);
  }
  $('roundBtn').onclick = () => {
    if (round.running) { round.running = false; game.stop(performance.now()); curses.clear(); $('timer').hidden = true; $('roundBtn').textContent = '▶ Start round'; log('■ Round stopped.'); }
    else startRound();
  };

  // ---------- Frame loop ----------
  face.onFrame((st) => {
    const now = performance.now();
    if (round.running && !calibrating) {
      game.update(now, st);
      if (game.phase !== 'eaten' && lives) curses.tick(st, now);
      const shieldLeft = game.shieldUntil - now;
      $('shieldPill').hidden = shieldLeft <= 0;
      if (shieldLeft > 0) $('shieldPill').textContent = `🛡️ Monster chained ${Math.ceil(shieldLeft / 1000)} s`;
      const left = Math.max(0, round.ends - now);
      const secs = Math.ceil(left / 1000);
      $('timer').textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
      $('timer').classList.toggle('low', left < 10000);
      if (left <= 0 && lives) endRound(true);
    }
    game.draw(now, video, st);
    $('lit').classList.toggle('on', round.running && game.lit && game.phase !== 'eaten');
    if (!calibrating) $('status').textContent = ({ loading: 'Loading face model…', ready: st.face ? 'Face found' : 'No face in view', fake: 'Manual sliders' }[st.status] || 'Camera off') + (face.mic || face.fake ? (st.sound > S.soundThreshold ? ' · 🔊' : ' · 🎤') : '');
    $('curses').innerHTML = curses.active.map((c) => {
      const cfg = S.curses[c.type], wait = now < c.starts;
      const left = Math.max(0, c.ends - Math.max(now, c.starts));
      return `<div class="curse">${cfg.icon} ${cfg.label} ${wait ? '– get ready' : (left / 1000).toFixed(1) + ' s'}<div class="bar"><i style="width:${wait ? 100 : Math.min(100, (left / (cfg.maxSeconds * 1000)) * 100)}%"></i></div></div>`;
    }).join('');
  });

  // ---------- Camera / calibration ----------
  function ready() {
    $('calBtn').disabled = false;
    $('roundBtn').disabled = false;
    $('startBtn').disabled = true;
    $('fakeBtn').disabled = true;
    notice('Calibrate with a relaxed face, then start a round.');
  }
  $('startBtn').onclick = async () => {
    MC.sfx.unlock(); MC.sfx.setVolume(S.volume);
    $('startBtn').disabled = true;
    notice('Loading camera and face model…');
    try {
      await face.start(video);
      ready();
      log('📷 Camera ready.');
      // Microphone is optional: without it the sound rules simply never trigger.
      try { const mic = new MC.Mic(); await mic.start(); face.mic = mic; log('🎤 Microphone ready.'); }
      catch (err) { log('🎤 No microphone access: the "silence" rules are off. Allow the microphone and reload to use them.'); }
    }
    catch (e) {
      $('startBtn').disabled = false;
      notice(e && e.name === 'NotAllowedError' ? 'Camera permission was denied. Allow it in the browser and try again.' : `Could not start the camera or face model. Check the internet connection.<br><small>${esc(e && e.message || e)}</small>`);
    }
  };
  $('fakeBtn').onclick = () => {
    MC.sfx.unlock(); MC.sfx.setVolume(S.volume);
    face.startFake();
    ready();
    $('fakeSliders').innerHTML = [['x', 'position', 1, 0.5], ['move', 'move', 4, 0], ['smile', 'smile', 1, 0], ['blink', 'blink', 1, 0], ['sound', 'sound', 1, 0]].map(([k, l, max, v]) =>
      `<label>${l}<input type="range" min="0" max="${max}" step="0.01" value="${v}" data-fake="${k}"></label>`).join('');
    $('fakeSliders').querySelectorAll('input').forEach((i) => i.oninput = () => { face.fake[i.dataset.fake] = +i.value; });
    log('🎚️ Manual mode: the sliders act as the face.');
  };
  $('calBtn').onclick = async () => {
    calibrating = true; $('calBtn').disabled = true;
    let n = 3;
    notice(`Relaxed face, stay quiet<big>${n}</big>`);
    const t = setInterval(() => { if (--n > 0) notice(`Relaxed face, stay quiet<big>${n}</big>`); }, 1000);
    const r = await face.calibrate(3000);
    clearInterval(t); calibrating = false; $('calBtn').disabled = false;
    if (r.rejected) notice(r.rejected === 'smile' ? 'You were smiling 😏<br><small>Relax and calibrate again.</small>' : 'Eyes looked half closed<br><small>Calibrate again.</small>');
    else if (r.samples) { notice('Calibrated ✓<br><small>Start a round when ready.</small>'); setTimeout(() => { if (!round.running) hideNotice(); }, 1500); }
    else notice('No face seen. Face the camera and try again.');
  };

  // ---------- Settings on this page ----------
  ['move', 'smile', 'blink', 'sound'].forEach((k) => {
    const c = $('r-' + k);
    c.checked = !!S.lightRules[k];
    c.onchange = () => { S.lightRules[k] = c.checked; save(); };
  });
  $('dark').value = S.darkness;
  $('dark').oninput = () => { S.darkness = +$('dark').value; save(); };
  $('vol').value = S.volume;
  $('vol').oninput = () => { S.volume = +$('vol').value; MC.sfx.setVolume(S.volume); save(); };

  // ---------- Simulator / live events ----------
  const viewer = () => $('viewer').value.trim() || 'viewer';
  document.querySelectorAll('[data-sim]').forEach((b) => b.onclick = () =>
    MC.bus.emit(b.dataset.sim === 'like' ? { type: 'like', user: viewer(), count: 25 } : { type: 'follow', user: viewer() }));
  $('giftBtns').innerHTML = S.gifts.map((g, i) => `<button data-gift="${i}">🎁 ${esc(g.gift)}</button>`).join('');
  $('giftBtns').querySelectorAll('button').forEach((b) => b.onclick = () => MC.bus.emit({ type: 'gift', user: viewer(), gift: S.gifts[+b.dataset.gift].gift, count: 1 }));

  const EFFECT_TEXT = { sweep: 'sent the hunter', stare: 'made it look at you', all: 'cursed you with everything' };
  MC.bus.on('*', (e) => {
    if (e.type === 'like') {
      feed(`❤️ ${esc(e.user)} ×${e.count}`);
      if (!round.running) return;
      likes += e.count || 1;
      // The viewer whose likes fill the bar gets the credit.
      if (likes >= S.likesForShield) { likes -= S.likesForShield; chain(e.user, performance.now()); }
      renderLikes();
      return;
    }
    if (e.type === 'follow') { feed(`➕ ${esc(e.user)} followed`); return; }
    if (e.type !== 'gift') return;
    const rule = S.gifts.find((g) => g.gift.toLowerCase() === e.gift.toLowerCase());
    giftCount[e.gift] = (giftCount[e.gift] || 0) + (e.count || 1);
    if (!rule || giftCount[e.gift] % Math.max(1, rule.every)) { feed(`🎁 ${esc(e.user)}: ${esc(e.gift)}`); return; }
    if (!round.running) { log(`🎁 ${esc(e.gift)} ignored: start a round first.`); return; }
    const now = performance.now();
    if (rule.curse === 'shield') { chain(e.user, now); return; }
    if (rule.curse === 'cleanse') {
      const n = curses.active.length + curses.queue.length;
      curses.clear();
      if (!savers.includes(e.user)) savers.push(e.user);
      banner(`🧹 ${esc(e.user)} removed ${n} curse${n === 1 ? '' : 's'}!`, true);
      log(`🧹 ${esc(e.user)} cleared the curses.`);
      return;
    }
    if (rule.curse === 'sweep' || rule.curse === 'stare') {
      game.gift(rule.curse, now, e.user);
      banner(rule.curse === 'sweep' ? `🔦 ${esc(e.user)} sent the hunter after you!` : `👁️ ${esc(e.user)} made it look at you!`);
    }
    else curses.add(rule.curse, e.user, now);
    const what = EFFECT_TEXT[rule.curse] || `cursed you: ${S.curses[rule.curse].label}`;
    if (rule.curse === 'sound' && !face.mic && !face.fake) log('🎤 Silence curse sent, but the microphone is off.');
    feed(`🎁 <b>${esc(e.user)}</b> ${what}`);
    log(`🎁 ${esc(e.user)} sent ${esc(e.gift)} → ${rule.curse}`);
  });

  function renderLikes() { $('likeBar').textContent = `❤️ ${Math.min(likes, S.likesForShield)}/${S.likesForShield} likes to chain it`; }
  renderLikes();
  renderLives();
